<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>City Environment Editor</title>
  <link rel="stylesheet" href="css/editor.css">
  <script type="importmap">
  {
    "imports": {
      "three": "./node_modules/three/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <aside id="editor-panel">
      <header class="panel-header">
        <h1>Environment Editor</h1>
        <p id="status">Loading tileset...</p>
      </header>

      <section class="tool-section">
        <h2>Tools</h2>
        <div id="toolbar" class="toolbar" role="toolbar" aria-label="Editor tools">
          <button type="button" class="tool-btn active" data-tool="paint" title="Paint (B)">
            <span class="tool-icon">&#9632;</span>
            Paint
          </button>
          <button type="button" class="tool-btn" data-tool="erase" title="Erase (E)">
            <span class="tool-icon">&#10005;</span>
            Erase
          </button>
          <button type="button" class="tool-btn" data-tool="pick" title="Eyedropper (I)">
            <span class="tool-icon">P</span>
            Pick
          </button>
          <button type="button" class="tool-btn" data-tool="fill" title="Fill (G)">
            <span class="tool-icon">&#9638;</span>
            Fill
          </button>
        </div>
        <div class="tool-options">
          <label class="checkbox-label">
            <input id="show-grid" type="checkbox" checked>
            Show grid
          </label>
          <span id="rotation-display" class="rotation-badge" title="Press R to rotate">Rot: 0</span>
        </div>
      </section>

      <section class="palette-section">
        <h2>Tiles</h2>
        <input id="tile-search" type="search" placeholder="Search tiles..." spellcheck="false">
        <div id="tile-palette" class="tile-palette"></div>
        <div id="selected-tile-preview" class="selected-tile-preview">
          <canvas id="selected-tile-canvas" width="64" height="64"></canvas>
          <span id="selected-tile-name">roadTexture_25</span>
        </div>
      </section>

      <section class="grid-section">
        <div id="grid-viewport" class="grid-viewport">
          <canvas id="grid-canvas"></canvas>
        </div>
        <p class="grid-hint">Scroll to zoom. Middle-click or Space+drag to pan. Click cells to edit.</p>
      </section>

      <footer class="panel-footer">
        <div class="grid-controls">
          <label>
            Width
            <input id="grid-width" type="number" min="4" max="128" value="24">
          </label>
          <label>
            Height
            <input id="grid-height" type="number" min="4" max="128" value="24">
          </label>
          <button id="resize-grid-btn" type="button">Resize</button>
          <button id="clear-grid-btn" type="button">Clear</button>
        </div>
        <div class="file-controls">
          <button id="undo-btn" type="button" disabled>Undo</button>
          <button id="redo-btn" type="button" disabled>Redo</button>
          <button id="export-btn" type="button">Export JSON</button>
          <label class="import-btn">
            Import JSON
            <input id="import-input" type="file" accept="application/json,.json" hidden>
          </label>
        </div>
      </footer>
    </aside>

    <main id="viewport-panel">
      <div id="viewport-header">
        <div class="viewport-title-row">
          <h2>3D Preview</h2>
          <button id="reset-camera-btn" type="button">Reset camera</button>
        </div>
        <div class="viewport-controls">
          <label class="viewport-control">
            Terrain height
            <input id="height-slider" type="range" min="0" max="80" value="22" step="1">
            <span id="height-value">0.22</span>
          </label>
          <label class="checkbox-label">
            <input id="wireframe-toggle" type="checkbox">
            Wireframe
          </label>
          <label class="viewport-control">
            Skybox
            <select id="skybox-select"></select>
          </label>
        </div>
        <p class="viewport-hint">Click the view to fly. <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> move, <kbd>E</kbd>/<kbd>C</kbd> up/down, mouse look.</p>
      </div>
      <div id="canvas-container"></div>
    </main>
  </div>

  <script type="module" src="js/editor-main.js"></script>
</body>
</html>
